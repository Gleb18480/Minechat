<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minechat Games</title>
<style>
:root { --bg: #0e1621; --panel: #17212b; --text: #ffffff; --text-muted: #8b9aab; --blue: #2AABEE; --border: #0e1621; --input-bg: #242f3d; }
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
html,body{background:var(--bg);color:var(--text);height:100%;width:100%;position:fixed;overflow:hidden;}
#app{height:100vh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;position:relative;background:var(--bg);}

#auth{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;background:linear-gradient(135deg,var(--panel),var(--bg));}
.auth-box{width:100%;max-width:400px;text-align:center;}
.logo{width:90px;height:90px;margin:0 auto 20px;background:linear-gradient(135deg,#2AABEE,#229ED9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;}
.inp{width:100%;padding:14px;margin-bottom:10px;border:none;border-radius:10px;background:var(--input-bg);color:var(--text);font-size:16px;}
.btn{width:100%;padding:14px;margin-top:8px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.btn.gray{background:#3a4a5a;}

#main{display:none;flex-direction:column;height:100%;}
.hdr{padding:12px 14px;background:var(--panel);display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--border);}
.hdr .title{flex:1;font-weight:600;font-size:17px;}
.coin-badge { background: #2e7d32; color: white; padding: 4px 10px; border-radius: 20px; font-weight: bold; }

#content-area { flex: 1; overflow-y: auto; }
.view { display: none; height: 100%; }
.view.active { display: block; }

.lst{padding:6px;}
.it{padding:15px; margin-bottom:5px; border-radius:9px; cursor:pointer; background:var(--panel); display:flex; align-items:center; gap:12px;}

#bottom-nav { display: flex; background: var(--panel); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0; color: var(--text-muted); cursor: pointer; font-size: 12px; }
.nav-item.active { color: var(--blue); font-weight: 600; }
.nav-icon { font-size: 24px; margin-bottom: 4px; }

#chat{display:none;flex-direction:column;height:100%;}
.ch{padding:12px;background:var(--panel);display:flex;align-items:center;border-bottom:1px solid var(--border);}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;}
.m{max-width:80%;padding:10px;border-radius:14px;font-size:15px;}
.mi{align-self:flex-start;background:var(--input-bg);}
.mo{align-self:flex-end;background:var(--blue);}
#inp{padding:10px;background:var(--panel);display:flex;gap:6px;}
#mi{flex:1;padding:12px;border-radius:20px;border:none;background:var(--input-bg);color:var(--text);}
.sb{background:var(--blue);border:none;color:#fff;width:44px;height:44px;border-radius:50%;}

.game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
.game-card { background: var(--panel); border-radius: 16px; padding: 15px; text-align: center; cursor: pointer; border: 1px solid var(--border); }

#gameScreen { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: none; flex-direction: column; padding: 20px; }
.ttt-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 100%; max-width: 300px; margin: 20px auto; }
.ttt-cell { background: var(--panel); height: 80px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; border-radius: 8px; cursor: pointer; }
.msg-invite { background: #1e3a8a; color: white; padding: 10px; border-radius: 8px; margin-top: 5px; cursor: pointer; text-align: center; font-weight: bold; }
</style>
</head>
<body>

<div id="app">
<div id="auth">
  <div class="auth-box">
    <div class="logo">🎮</div>
    <h2>Minechat Games</h2>
    <input class="inp" id="loginName" placeholder="Логин" value="Носов Глеб">
    <input class="inp" id="loginPass" type="password" placeholder="Пароль" value="310315">
    <button class="btn" onclick="doLogin()">Войти</button>
  </div>
</div>

<div id="main">
  <div class="hdr">
    <div class="title">Minechat</div>
    <div class="coin-badge" id="coinDisplay">🪙 0</div>
  </div>

  <div id="content-area">
    <div id="view-chats" class="view active">
      <div class="lst" id="cl"></div>
    </div>
    
    <div id="view-settings" class="view">
      <div class="lst">
        <div class="it" onclick="logout()" style="color:#e74c3c;">🚪 Выйти</div>
      </div>
    </div>
  </div>

  <div id="bottom-nav">
    <div class="nav-item active" onclick="switchTab('chats')" id="nav-chats"><div class="nav-icon">💬</div>Чаты</div>
    <div class="nav-item" onclick="switchTab('settings')" id="nav-settings"><div class="nav-icon">⚙️</div>Настройки</div>
  </div>
</div>

<div id="chat">
  <div class="ch">
    <button onclick="backToMain()" style="background:none;border:none;color:var(--blue);font-size:24px;">←</button>
    <div style="flex:1;font-weight:bold;" id="hn">Чат</div>
    <!-- КНОПКА ИГРЫ В ЧАТЕ -->
    <button onclick="openGameMenu()" style="background:none;border:none;font-size:24px; cursor:pointer; margin-right:10px;">🎮</button>
    <button style="background:none;border:none;font-size:20px;">📞</button>
  </div>
  <div id="msgs"></div>
  <div id="inp">
    <input id="mi" placeholder="Сообщение..." autocomplete="off">
    <button class="sb" onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- МЕНЮ ВЫБОРА ИГРЫ В ЧАТЕ -->
<div class="modal" id="gameMenuModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:6000; align-items:center; justify-content:center;">
    <div style="background:var(--panel); padding:20px; border-radius:16px; width:90%; max-width:400px;">
        <h3>Выберите игру для этого чата</h3>
        <button class="btn" onclick="createRoomFromChat('tictactoe')" style="margin-top:10px;">❌⭕ Крестики-нолики</button>
        <button class="btn" onclick="createRoomFromChat('cities')" style="margin-top:10px;">🏙️ Города</button>
        <button class="btn" onclick="createRoomFromChat('football')" style="margin-top:10px;">⚽ Футбол</button>
        <button class="btn gray" onclick="document.getElementById('gameMenuModal').style.display='none'">Отмена</button>
    </div>
</div>

<!-- ЭКРАН ИГРЫ -->
<div id="gameScreen">
    <h3 id="gameTitle" style="text-align:center;">Игра</h3>
    <div id="gameStatus" style="text-align:center; color:var(--text-muted); margin:10px 0;"></div>
    <div id="tttBoard" class="ttt-board" style="display:none;"></div>
    <div id="citiesBoard" style="display:none; text-align:center;">
        <div id="citiesHistory" style="height:200px; overflow-y:auto; margin-bottom:10px; background:var(--panel); padding:10px; border-radius:10px;"></div>
        <input class="inp" id="cityInput" placeholder="Введите город...">
        <button class="btn" onclick="sendCity()">Отправить</button>
    </div>
    <div id="footballBoard" style="display:none; text-align:center;">
        <h1 style="font-size:60px;">⚽</h1>
        <p id="footballText" style="margin:10px 0;">Выберите зону (1, 2 или 3)</p>
        <div style="display:flex; gap:10px; justify-content:center;">
            <button class="btn" onclick="sendFootball('1')">1</button>
            <button class="btn" onclick="sendFootball('2')">2</button>
            <button class="btn" onclick="sendFootball('3')">3</button>
        </div>
    </div>
    <button class="btn gray" style="margin-top:20px;" onclick="leaveGame()">Выйти из игры</button>
</div>

</div>

<script>
var wsProto = location.protocol === 'https:' ? 'wss://' : 'ws://';
var ws = null, cu = null, cc = null;
var USERS = {}, CHATS = {}, MESSAGES = {}, COINS = {}, PINNED = [];
var activeRoom = null;

function connect() {
  ws = new WebSocket(wsProto + location.host + "/ws");
  ws.onopen = () => ws.send(JSON.stringify({action:'login', username: cu, password: document.getElementById('loginPass').value}));
  ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
}
function send(d) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(d)); }

function updateCoinUI() { document.getElementById('coinDisplay').innerText = '🪙 ' + (COINS[cu] || 0); }

function handleMessage(m) {
  switch (m.action) {
    case 'login_ok':
      cu = m.username; USERS = m.users; CHATS = {}; m.chats.forEach(c=>CHATS[c.id]=c);
      COINS = m.coins || {}; PINNED = m.pinned || [];
      document.getElementById('auth').style.display='none'; document.getElementById('main').style.display='flex';
      updateCoinUI(); renderChats(); switchTab('chats');
      break;
    case 'balance_update':
      COINS[cu] = m.coins; updateCoinUI(); break;
    case 'new_message':
      if (!MESSAGES[m.chat_id]) MESSAGES[m.chat_id] = [];
      MESSAGES[m.chat_id].push(m.msg);
      if (cc === m.chat_id) appendMsg(m.msg);
      break;
    case 'chat_opened':
      cc=m.chat_id; MESSAGES[cc]=m.messages; document.getElementById('main').style.display='none'; document.getElementById('chat').style.display='flex'; document.getElementById('hn').innerText = m.chat.name || m.chat.members.find(x=>x!==cu); renderMsgs(); break;
    case 'game_started':
      activeRoom = m; 
      document.getElementById('gameMenuModal').style.display='none';
      document.getElementById('gameScreen').style.display = 'flex';
      document.getElementById('gameTitle').innerText = m.game.toUpperCase();
      document.getElementById('gameStatus').innerText = m.turn === cu ? "ВАШ ХОД" : "Ход соперника: " + m.turn;
      if(m.game === 'tictactoe') { document.getElementById('tttBoard').style.display='grid'; renderTTT(); }
      if(m.game === 'cities') { document.getElementById('citiesBoard').style.display='block'; renderCities(); }
      if(m.game === 'football') { document.getElementById('footballBoard').style.display='block'; }
      break;
    case 'game_update':
      if(activeRoom) {
        activeRoom.board = m.board; activeRoom.turn = m.turn;
        document.getElementById('gameStatus').innerText = m.turn === cu ? "ВАШ ХОД" : "Ход соперника: " + m.turn;
        if(activeRoom.game === 'tictactoe') renderTTT();
        if(activeRoom.game === 'cities') renderCities();
        if(activeRoom.game === 'football') {
            document.getElementById('footballText').innerText = m.board.step === 'shoot' ? "Вы бьете! Выберите зону (1-3)" : "Вы вратарь! Куда прыгаем? (1-3)";
        }
      }
      break;
    case 'game_over':
      alert(m.winner === "draw" ? "Ничья!" : "Победа: " + m.winner);
      COINS[cu] = m.coins; updateCoinUI();
      leaveGame();
      break;
    case 'error': alert(m.text); break;
  }
}

function openGameMenu() { if(!cc) return; document.getElementById('gameMenuModal').style.display = 'flex'; }

function createRoomFromChat(type) {
    var bet = parseInt(prompt("Введите ставку (монеты):", "100"));
    if(!bet || bet <= 0) return;
    if((COINS[cu]||0) < bet) return alert("Мало монет!");
    // Отправляем запрос ВМЕСТЕ с ID текущего чата
    send({action: 'create_room', game: type, bet: bet, chat_id: cc});
    document.getElementById('gameMenuModal').style.display = 'none';
}

function joinGame(roomId) { send({action: 'join_room', room_id: roomId, chat_id: cc}); }

function renderTTT() {
    var b = document.getElementById('tttBoard'); b.innerHTML = '';
    activeRoom.board.forEach((cell, i) => {
        var d = document.createElement('div'); d.className = 'ttt-cell'; d.innerText = cell;
        d.onclick = () => { if(cell === "" && activeRoom.turn === cu) send({action: 'game_move', room_id: activeRoom.room_id, move: i}); };
        b.appendChild(d);
    });
}
function renderCities() {
    var h = document.getElementById('citiesHistory'); h.innerHTML = '';
    activeRoom.board.forEach(x => { h.innerHTML += `<div style="margin:5px 0;"><b>${x.user}:</b> ${x.word}</div>`; });
    h.scrollTop = h.scrollHeight;
}
function sendCity() {
    var w = document.getElementById('cityInput').value.trim();
    if(!w) return; send({action:'game_move', room_id: activeRoom.room_id, move: w});
    document.getElementById('cityInput').value = '';
}
function sendFootball(zone) { send({action:'game_move', room_id: activeRoom.room_id, move: zone}); }
function leaveGame() { document.getElementById('gameScreen').style.display = 'none'; activeRoom = null; }

// ОБЩЕЕ
function renderChats() {
  var l = document.getElementById('cl'); l.innerHTML='';
  Object.keys(CHATS).forEach(cid => {
    var it = document.createElement('div'); it.className='it';
    it.innerHTML = `<div style="font-size:24px;">💬</div><div>${CHATS[cid].name || CHATS[cid].members.find(x=>x!==cu)}</div>`;
    it.onclick = () => send({action:'open_chat', chat_id: cid}); l.appendChild(it);
  });
}
function renderMsgs() { var c=document.getElementById('msgs'); c.innerHTML=''; (MESSAGES[cc]||[]).forEach(m=>appendMsg(m, true)); }
function appendMsg(m, skip) {
    var c = document.getElementById('msgs'); var d = document.createElement('div');
    var mine = m.from === cu; d.className = 'm '+(mine?'mo':'mi');
    var html = '';
    if(!mine) html += `<div style="font-size:12px; color:var(--blue); font-weight:bold; margin-bottom:2px;">${m.from}</div>`;
    if(m.type === 'game_invite') {
        html += `<div>${m.text}</div><div class="msg-invite" onclick="joinGame('${m.data}')">🎮 Присоединиться</div>`;
    } else { html += m.text || ''; }
    d.innerHTML = html; c.appendChild(d);
    if(!skip) c.scrollTop = c.scrollHeight;
}
function sendMessage() { var t=document.getElementById('mi').value.trim(); if(!t || !cc) return; send({action:'message', chat_id: cc, type:'text', text: t}); document.getElementById('mi').value=''; }
function switchTab(tab) { document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); document.getElementById('view-'+tab).classList.add('active'); document.getElementById('nav-'+tab).classList.add('active'); }
function backToMain() { document.getElementById('chat').style.display='none'; document.getElementById('main').style.display='flex'; cc=null; }
function doLogin() { cu=document.getElementById('loginName').value.trim(); if(!cu) return; connect(); }
function logout() { location.reload(); }
</script>
</body>
</html>
