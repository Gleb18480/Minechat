<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minechat (Russia)</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
:root { --bg: #0e1621; --panel: #17212b; --text: #ffffff; --text-muted: #8b9aab; --blue: #2AABEE; --border: #0e1621; --input-bg: #242f3d; }
body.light-theme { --bg: #f4f4f5; --panel: #ffffff; --text: #000000; --text-muted: #707579; --blue: #2AABEE; --border: #e1e1e1; --input-bg: #efefef; }
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);height:100%;width:100%;position:fixed;overflow:hidden;overscroll-behavior:none;}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;width:100%;max-width:900px;margin:0 auto;position:relative;background:var(--bg);}
#auth{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;overflow-y:auto;}
.auth-box{width:100%;max-width:400px;text-align:center;}
.inp{width:100%;padding:14px;margin-bottom:10px;border:none;border-radius:10px;background:var(--input-bg);color:var(--text);font-size:16px;outline:none;}
.btn{width:100%;padding:14px;margin-top:8px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.btn.gray{background:#3a4a5a;} .btn.red{background:#e74c3c;} .btn.purple{background:#9c27b0;}
#main{display:none;flex-direction:column;height:100%;}
.hdr{padding:12px 14px;background:var(--panel);display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--border);}
#content-area { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.view { display: none; flex: 1; overflow-y: auto; }
.view.active { display: block; }
#bottom-nav { display: flex; background: var(--panel); border-top: 1px solid var(--border); }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0; color: var(--text-muted); cursor: pointer; font-size: 12px; }
.nav-item.active { color: var(--blue); }
.nav-icon { font-size: 24px; margin-bottom: 4px; }
.it{padding:11px;display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:9px;}
.it:active{background:var(--input-bg);}
.av{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:20px;color:#fff;position:relative;}
.av-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.av img{width:100%;height:100%;object-fit:cover;}
.story-ring { border: 2px solid var(--blue); padding: 2px; }
#chat{display:none;flex-direction:column;height:100%;}
.ch{padding:11px 14px;background:var(--panel);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:4px;}
.m{max-width:80%;padding:8px 12px;border-radius:14px;font-size:15px;position:relative;touch-action:pan-y; transition: transform 0.2s; word-break: break-word;}
.mi{align-self:flex-start;background:var(--input-bg);}
.mo{align-self:flex-end;background:var(--blue);color:#fff;}
.m img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
.msg-actions{position:absolute;top:-34px;right:0;background:var(--panel);border-radius:8px;padding:4px;display:none;gap:4px;box-shadow:0 4px 12px rgba(0,0,0,.5);z-index:10;}
.msg-actions button{background:none;border:none;color:var(--text-muted);font-size:16px;padding:4px 8px; cursor: pointer;}
.m.show-actions .msg-actions{display:flex;}
#inp{padding:10px;background:var(--panel);display:flex;align-items:center;gap:6px;border-top:1px solid var(--border);}
#mi{flex:1;padding:12px;border-radius:22px;border:none;background:var(--input-bg);color:var(--text);outline:none;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:3000;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--panel);border-radius:16px;padding:24px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;}
.stories-row { display: flex; gap: 10px; overflow-x: auto; padding: 10px; background: var(--panel); border-bottom: 1px solid var(--border); }
.story-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; }
.story-item .av { width: 60px; height: 60px; }
.doc-msg { border: 1px solid var(--blue); padding: 10px; border-radius: 8px; background: rgba(42,171,238,0.1); display: flex; gap: 10px; cursor: pointer; margin-top: 5px;}
#incomingScreen { display:none; position:fixed; inset:0; background:linear-gradient(135deg,var(--bg),var(--panel)); z-index:99999; flex-direction:column; align-items:center; justify-content:space-between; padding:60px 20px; text-align:center;}
.inc-avatar { width:140px; height:140px; border-radius:50%; margin:0 auto 24px; display:flex; align-items:center; justify-content:center; font-size:56px; font-weight:600; color:#fff; overflow:hidden; background:var(--blue); animation:pulse 1.5s infinite;}
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(42,171,238,0.7); } 70% { box-shadow: 0 0 0 40px rgba(42,171,238,0); } 100% { box-shadow: 0 0 0 0 rgba(42,171,238,0); } }
</style>
</head>
<body>

<div id="app">
<!-- АВТОРИЗАЦИЯ / СОХРАНЕННЫЕ АККАУНТЫ -->
<div id="auth">
  <div class="auth-box">
    <div class="logo" style="font-size:48px; color:var(--blue); margin-bottom:10px;">✈</div>
    <h2 id="authTitle">Minechat (Russia)</h2>
    <div id="savedAccounts" style="margin-bottom:20px;"></div>
    
    <div id="loginForm">
        <input class="inp" id="au" placeholder="Имя пользователя">
        <input class="inp" id="ap" type="password" placeholder="Пароль">
        <button class="btn" onclick="doLogin()">Войти</button>
        <button class="btn gray" style="margin-top:10px;" onclick="document.getElementById('regStep1').style.display='block'; this.style.display='none';">Создать аккаунт</button>
    </div>

    <!-- Регистрация -->
    <div id="regStep1" style="display:none; margin-top:20px;">
        <input class="inp" id="regName" placeholder="Имя">
        <input class="inp" id="regPhone" placeholder="Телефон">
        <input class="inp" id="regEmail" placeholder="Email">
        <button class="btn" onclick="regNext(1)">Далее</button>
    </div>
    <div id="regStep2" style="display:none; margin-top:20px;">
        <input class="inp" id="regPass" type="password" placeholder="Пароль">
        <button class="btn" onclick="regNext(2)">Далее</button>
    </div>
    <div id="regStep3" style="display:none; margin-top:20px;">
        <video id="ageVerifyVideo" autoplay playsinline muted style="width:100%; border-radius:12px; transform:scaleX(-1);"></video>
        <div id="ageVerifyStatus" style="margin:10px 0;">Загрузка камеры...</div>
        <button class="btn" onclick="startAgeVerification()">Начать проверку</button>
    </div>
  </div>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="main">
  <div class="hdr"><div class="title" style="flex:1;">Minechat (Russia)</div><div class="dot" id="wsDot" style="width:9px; height:9px; border-radius:50%; background:#4caf50;"></div></div>
  
  <div class="stories-row" id="storiesRow">
    <div class="story-item" onclick="addStory()"><div class="av" style="background:var(--input-bg);">➕</div><span>Добавить</span></div>
  </div>

  <div id="content-area">
    <div id="view-chats" class="view active">
      <div class="srch-wrap" style="padding:10px;"><input class="inp" id="sr" placeholder="Поиск чатов" oninput="renderChats(this.value)"></div>
      <div class="lst" id="cl"></div>
    </div>
    <div id="view-search" class="view">
      <div class="srch-wrap" style="padding:10px;"><input class="inp" id="sr-global" placeholder="Поиск людей..." oninput="searchUsers(this.value)"></div>
      <div class="lst" id="global-search-list"></div>
    </div>
    <div id="view-settings" class="view">
      <div class="lst">
        <div class="it" onclick="openProfile()">👤 Мой профиль</div>
        <div class="it" onclick="logout()" style="color:#e74c3c;">🚪 Выйти</div>
      </div>
    </div>
  </div>

  <div id="bottom-nav">
    <div class="nav-item active" onclick="switchTab('chats')" id="nav-chats"><div class="nav-icon">💬</div>Чаты</div>
    <div class="nav-item" onclick="switchTab('search')" id="nav-search"><div class="nav-icon">🔍</div>Поиск</div>
    <div class="nav-item" onclick="switchTab('settings')" id="nav-settings"><div class="nav-icon">⚙️</div>Настройки</div>
  </div>
</div>

<!-- ЧАТ -->
<div id="chat">
  <div class="ch">
    <button onclick="backToMain()" style="background:none;border:none;color:var(--blue);font-size:24px;">←</button>
    <div class="av" id="ha" style="width:40px;height:40px;"><div class="av-inner">?</div></div>
    <div style="flex:1;"><div id="hn" style="font-weight:600;">-</div></div>
    <button onclick="send({action:'set_pin', chat_id: cc})" style="background:none;border:none;font-size:20px; cursor:pointer;">📌</button>
  </div>
  <div id="msgs"></div>
  <div id="inp">
    <button class="ib" onclick="showAttachMenu()" style="background:none;border:none;font-size:24px;color:var(--text-muted); cursor:pointer;">📎</button>
    <input id="mi" placeholder="Сообщение..." autocomplete="off">
    <button onclick="sendMessage()" style="background:var(--blue);color:#fff;border:none;border-radius:50%;width:40px;height:40px; cursor:pointer;">➤</button>
  </div>
</div>

<!-- ЭКРАН ВХОДЯЩЕГО ЗВОНКА -->
<div id="incomingScreen">
    <div style="text-align:center;">
        <div style="font-size:14px; color:var(--text-muted); text-transform:uppercase; margin-bottom:30px;">Входящий звонок</div>
        <div class="inc-avatar" id="incAvatar">?</div>
        <div id="incName" style="font-size:32px; font-weight:600; margin-bottom:8px;">-</div>
        <div id="incType" style="font-size:16px; color:var(--text-muted);">📞 Аудиозвонок</div>
    </div>
    <div style="display:flex; gap:60px;">
        <div><button onclick="declineIncoming()" style="width:80px;height:80px;border-radius:50%;border:none;font-size:34px;background:#e74c3c;color:#fff; cursor:pointer;">📵</button><div style="color:var(--text-muted); margin-top:10px;">Отклонить</div></div>
        <div><button id="incAcceptBtn" onclick="acceptIncoming()" style="width:80px;height:80px;border-radius:50%;border:none;font-size:34px;background:#4caf50;color:#fff; cursor:pointer;">📞</button><div style="color:var(--text-muted); margin-top:10px;">Принять</div></div>
    </div>
</div>

<!-- МОДАЛКИ -->
<div class="modal" id="forwardModal"><div class="modal-box"><h3>Переслать в:</h3><div id="forwardList"></div><button class="btn gray" onclick="document.getElementById('forwardModal').style.display='none'">Отмена</button></div></div>
<div class="modal" id="docModal"><div class="modal-box"><h3 id="docTitle" contenteditable="true" style="outline:none; border-bottom:1px solid var(--border); padding-bottom:5px;">Документ</h3><textarea id="docText" style="width:100%;height:200px;margin-top:10px;padding:10px;background:var(--input-bg);color:var(--text);border:none; border-radius:8px; outline:none; resize:none;"></textarea><button class="btn" onclick="saveDoc()">Сохранить</button><button class="btn gray" onclick="downloadDoc()">Скачать .txt</button></div></div>
<div class="modal" id="profileModal"><div class="modal-box"><h3>Профиль</h3><p style="margin-bottom:15px; color:var(--text-muted);">Разрешения для звонков и медиа</p><button class="btn gray" onclick="requestPermissions()">Запросить все разрешения</button><button class="btn" onclick="document.getElementById('profileModal').style.display='none'">Закрыть</button></div></div>

</div>

<script>
var wsProto = location.protocol === 'https:' ? 'wss://' : 'ws://';
var ws, cu, cc, USERS = {}, CHATS = {}, MESSAGES = {}, STORIES = {}, PINNED = [], searchTimeout, currentDocId = null, replyTo = null;
var isCaller = false, callTarget = null, isVideoCall = false, pc = null, localStream = null;
var regData = {};

// Проверка на Shared Text (когда поделились из другого приложения)
const urlParams = new URLSearchParams(window.location.search);
const sharedText = urlParams.get('shared_text');
if (sharedText) setTimeout(() => alert('Вы поделились текстом: ' + sharedText), 1000);

// Загрузка сохраненных аккаунтов
function loadSavedAccounts() {
    var accounts = JSON.parse(localStorage.getItem('mc_accounts') || '[]');
    var box = document.getElementById('savedAccounts'); box.innerHTML = '';
    if(accounts.length > 0) document.getElementById('loginForm').style.display = 'none';
    accounts.forEach(acc => {
        var btn = document.createElement('div');
        btn.className = 'it'; btn.style.background = 'var(--panel)'; btn.style.marginBottom = '8px';
        btn.innerHTML = `<div class="av" style="background:var(--blue);">${acc.u.charAt(0)}</div><div style="flex:1; text-align:left; font-weight:600;">${acc.u}</div>`;
        btn.onclick = () => { document.getElementById('au').value = acc.u; document.getElementById('ap').value = acc.p; doLogin(); };
        box.appendChild(btn);
    });
    if(accounts.length > 0) {
        var btnAdd = document.createElement('button'); btnAdd.className='btn gray'; btnAdd.innerText='Другой аккаунт';
        btnAdd.onclick = () => { document.getElementById('loginForm').style.display='block'; box.innerHTML=''; };
        box.appendChild(btnAdd);
    }
}
loadSavedAccounts();

function saveAccount(u, p) {
    var accounts = JSON.parse(localStorage.getItem('mc_accounts') || '[]');
    accounts = accounts.filter(x => x.u !== u);
    accounts.unshift({u: u, p: p});
    if(accounts.length > 2) accounts.pop();
    localStorage.setItem('mc_accounts', JSON.stringify(accounts));
}

function connect() {
    ws = new WebSocket(wsProto + location.host + "/ws");
    ws.onmessage = (e) => handleMsg(JSON.parse(e.data));
    ws.onopen = () => { ws.send(JSON.stringify({action:'login', username: cu, password: document.getElementById('ap').value})); };
    ws.onclose = () => document.getElementById('wsDot').style.background = '#e74c3c';
}
function send(d) { if(ws && ws.readyState === 1) ws.send(JSON.stringify(d)); }

function handleMsg(m) {
    if(m.action==='register_ok') { cu = regData.name; saveAccount(cu, regData.pass); connect(); }
    if(m.action==='login_ok') {
        USERS = {}; m.users.forEach(u => USERS[u] = {color:"#2AABEE"}); CHATS = {}; m.chats.forEach(c=>CHATS[c.id]=c);
        STORIES = m.stories || {}; PINNED = m.pinned || [];
        document.getElementById('auth').style.display='none'; document.getElementById('main').style.display='flex';
        renderChats(); renderStories();
        if ("Notification" in window) Notification.requestPermission();
    }
    if(m.action==='new_message') { 
        if(!MESSAGES[m.chat_id]) MESSAGES[m.chat_id]=[]; 
        MESSAGES[m.chat_id].push(m.msg); 
        if(cc===m.chat_id) appendMsg(m.msg); 
    }
    if(m.action==='chat_opened') {
        cc=m.chat_id; MESSAGES[cc]=m.messages; document.getElementById('main').style.display='none';
        document.getElementById('chat').style.display='flex'; document.getElementById('hn').innerText = m.chat.name || m.chat.members.find(x=>x!==cu);
        renderMsgs();
    }
    if(m.action==='incoming_call') {
        isVideoCall = m.data && m.data.video; callTarget = m.from;
        document.getElementById('incName').innerText = m.from; document.getElementById('incType').innerText = isVideoCall ? '📹 Видеозвонок' : '📞 Аудиозвонок';
        document.getElementById('incAvatar').innerText = m.from.charAt(0); document.getElementById('incomingScreen').style.display = 'flex';
        if(navigator.vibrate) navigator.vibrate([500, 300, 500, 300, 500]);
    }
    if(m.action==='call_ended' || m.action==='call_declined') { endCall(true); }
    if(m.action==='call_accepted') { document.getElementById('incomingScreen').style.display='none'; if(isCaller) createOffer(); }
    if(m.action==='webrtc') { handleWebRTC(m.from, m.data); }
    if(m.action==='pins_updated') { PINNED = m.pinned; renderChats(); }
    if(m.action==='stories_updated') { STORIES = m.stories; renderStories(); }
    if(m.action==='search_results') { renderSearchResults(m.results); }
    if(m.action==='doc_data') { currentDocId = m.doc_id; document.getElementById('docTitle').innerText = m.title; document.getElementById('docText').value = m.text; document.getElementById('docModal').style.display='flex'; }
}

function renderChats(filter) {
    var cl = document.getElementById('cl'); cl.innerHTML='';
    PINNED.forEach(cid => {
        if(CHATS[cid]) {
            var it = document.createElement('div'); it.className='it';
            it.innerHTML = `<div class="av" style="background:var(--blue);">📌</div><div>${CHATS[cid].name || CHATS[cid].members.find(x=>x!==cu)}</div>`;
            it.onclick = () => openChat(cid); cl.appendChild(it);
        }
    });
    Object.keys(CHATS).forEach(cid => {
        if(PINNED.includes(cid)) return;
        var it = document.createElement('div'); it.className='it';
        it.innerHTML = `<div class="av" style="background:var(--blue);">💬</div><div>${CHATS[cid].name || CHATS[cid].members.find(x=>x!==cu)}</div>`;
        it.onclick = () => openChat(cid); cl.appendChild(it);
    });
}
function renderStories() {
    var row = document.getElementById('storiesRow'); row.innerHTML = `<div class="story-item" onclick="addStory()"><div class="av" style="background:var(--input-bg);">➕</div><span>Добавить</span></div>`;
    Object.keys(STORIES).forEach(u => {
        var el = document.createElement('div'); el.className='story-item';
        el.innerHTML = `<div class="av story-ring"><div class="av-inner"><img src="${STORIES[u].image}"></div></div><span>${u}</span>`;
        el.onclick = () => alert("История от " + u + "\nВремя: " + STORIES[u].time); row.appendChild(el);
    });
}
function addStory() {
    var inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange = () => { 
        var r = new FileReader(); 
        r.onload=()=>{ send({action:'add_story', image: r.result}); }; 
        r.readAsDataURL(inp.files[0]); 
    }; 
    inp.click();
}
function openChat(cid) { send({action:'open_chat', chat_id: cid}); send({action:'mark_read', chat_id: cid}); }
function switchTab(t) {
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    document.getElementById('view-'+t).classList.add('active'); document.getElementById('nav-'+t).classList.add('active');
}
function searchUsers(q) { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => send({action:'search_users', query: q}), 500); }
function renderSearchResults(list) {
    var el = document.getElementById('global-search-list'); el.innerHTML='';
    list.forEach(u => {
        var it = document.createElement('div'); it.className='it'; it.innerText = u;
        it.onclick = () => { send({action:'open_private', with: u}); switchTab('chats'); }; el.appendChild(it);
    });
}

function renderMsgs() { var c=document.getElementById('msgs'); c.innerHTML=''; (MESSAGES[cc]||[]).forEach(m=>appendMsg(m, true)); }
function appendMsg(m, skip) {
    var c = document.getElementById('msgs'); var d = document.createElement('div');
    var mine = m.from === cu; d.className = 'm '+(mine?'mo':'mi');
    
    let startX=0, currX=0;
    d.addEventListener('touchstart', e=>{startX=e.touches[0].clientX;});
    d.addEventListener('touchmove', e=>{currX=e.touches[0].clientX; if(currX-startX>0)d.style.transform=`translateX(${Math.min(currX-startX,50)}px)`;});
    d.addEventListener('touchend', ()=>{if(currX-startX>40) replyTo = m.id; d.style.transform='translateX(0)'; startX=0; currX=0;});

    d.onclick = () => { document.querySelectorAll('.m').forEach(x=>x.classList.remove('show-actions')); d.classList.add('show-actions'); };
    
    var html = m.text || '';
    if(m.type==='doc') html = `<div class="doc-msg" onclick="send({action:'get_doc',doc_id:'${m.id}'})"><span>📄</span> ${m.text}</div>`;
    if(m.type==='image') html = `<img src="${m.data}">`;
    
    html += `<div class="msg-actions">
        <button onclick="event.stopPropagation();replyTo='${m.id}';alert('Режим ответа включен')">↩</button>
        <button onclick="event.stopPropagation();showForward('${m.id}')">↪️</button>
        ${mine ? `<button onclick="event.stopPropagation();send({action:'delete',chat_id:'${cc}',msg_id:'${m.id}'})">🗑</button>` : ''}
    </div>`;
    d.innerHTML = html; c.appendChild(d); if(!skip) c.scrollTop = c.scrollHeight;
}
function showForward(id) {
    var msg = MESSAGES[cc].find(x=>x.id===id); document.getElementById('forwardList').innerHTML = '';
    Object.keys(CHATS).forEach(cid => {
        var it = document.createElement('div'); it.className='it'; it.innerText = CHATS[cid].name || CHATS[cid].members.find(x=>x!==cu);
        it.onclick = () => { send({action:'forward', to_chat: cid, msg: msg}); document.getElementById('forwardModal').style.display='none'; };
        document.getElementById('forwardList').appendChild(it);
    });
    document.getElementById('forwardModal').style.display='flex';
}

// ===== ОТПРАВКА ВЛОЖЕНИЙ =====
function showAttachMenu() {
    var m = document.createElement('div'); 
    m.className='menu'; m.style.bottom='70px'; m.style.left='10px'; m.style.background='var(--panel)'; 
    m.style.padding='10px'; m.style.borderRadius='10px'; m.style.position='absolute'; m.style.zIndex='1000';
    m.innerHTML = `
        <div onclick="openCamera()" style="padding:10px; cursor:pointer;">📷 Сделать фото</div>
        <div onclick="openGallery()" style="padding:10px; cursor:pointer;">🖼 Фото из галереи</div>
        <div onclick="createDoc()" style="padding:10px; cursor:pointer;">📝 Создать документ (.txt)</div>
    `;
    document.body.appendChild(m);
    setTimeout(()=>document.addEventListener('click', ()=>m.remove(), {once:true}), 100);
}

function openCamera() { 
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment'; 
    inp.onchange = () => { sendPhoto(inp.files[0]); }; inp.click(); 
}

function openGallery() { 
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true; 
    inp.onchange = () => { Array.from(inp.files).forEach(f => sendPhoto(f)); }; inp.click(); 
}

function sendPhoto(file) {
    if (!cc || !file) return;
    if (file.size > 10 * 1024 * 1024) { alert('Фото > 10 МБ'); return; }
    
    // ⚠️ ВСТАВЬ СЮДА СВОЙ КЛЮЧ ОТ IMGBB
    var IMGBB_KEY = '4640dc0ba0b1c0142e3907c30ed07897'; 

    alert('Загрузка фото... Пожалуйста, подождите.');
    
    var formData = new FormData();
    formData.append('image', file);

    fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_KEY, { method: 'POST', body: formData })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            send({action:'message', chat_id: cc, type:'image', data: data.data.url, fname: file.name, mime: 'image/jpeg', reply_to: replyTo || ''});
            replyTo = null;
        } else {
            alert('Ошибка загрузки фото: ' + data.error.message);
        }
    })
    .catch(err => alert('Ошибка сети при загрузке фото: ' + err.message));
}

function createDoc() { var t = prompt('Название (добавьте .txt):', 'Документ.txt'); if(t) send({action:'message', chat_id: cc, type:'doc', text:t}); }
function saveDoc() { send({action:'save_doc', doc_id: currentDocId, title: document.getElementById('docTitle').innerText, text: document.getElementById('docText').value}); }
function downloadDoc() { var blob = new Blob([document.getElementById('docText').value], {type: 'text/plain'}); var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = document.getElementById('docTitle').innerText || 'doc.txt'; a.click(); }

function sendMessage() { var t = document.getElementById('mi').value.trim(); if(!t || !cc) return; send({action:'message', chat_id: cc, type:'text', text: t, reply_to: replyTo||''}); document.getElementById('mi').value=''; replyTo=null; }
function backToMain() { document.getElementById('chat').style.display='none'; document.getElementById('main').style.display='flex'; cc=null; }
function openProfile() { document.getElementById('profileModal').style.display='flex'; }
function requestPermissions() { Notification.requestPermission(); navigator.mediaDevices.getUserMedia({audio:true,video:true}).then(s=>s.getTracks().forEach(t=>t.stop())).catch(e=>alert("Ошибка: "+e)); }
function logout() { localStorage.removeItem('mc_last_user'); location.reload(); }

function acceptIncoming() { document.getElementById('incomingScreen').style.display='none'; isCaller = false; send({action:'call_answer', to: callTarget}); startWebRTC(); }
function declineIncoming() { document.getElementById('incomingScreen').style.display='none'; send({action:'call_decline', to: callTarget}); callTarget = null; }
async function startWebRTC() {
    try { localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: isVideoCall}); } catch(e) { alert('Нет камеры/микрофона'); return; }
    pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.yandex.ru'}, {urls:'stun:stun.l.google.com:19302'}]});
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    pc.onicecandidate = e => { if (e.candidate) send({action:'webrtc', to: callTarget, data:{type:'candidate', candidate:e.candidate}}); };
    pc.ontrack = e => { alert('Звонок соединен! (Аудио выводится в динамик)'); };
}
async function createOffer() { if(!pc) await startWebRTC(); var offer = await pc.createOffer(); await pc.setLocalDescription(offer); send({action:'webrtc', to: callTarget, data:{type:'offer', sdp: offer}}); }
async function handleWebRTC(from, data) {
    if(!pc) await startWebRTC();
    if(data.type==='offer') { await pc.setRemoteDescription(new RTCSessionDescription(data.sdp)); var ans = await pc.createAnswer(); await pc.setLocalDescription(ans); send({action:'webrtc', to: from, data:{type:'answer', sdp: ans}}); }
    if(data.type==='answer') { await pc.setRemoteDescription(new RTCSessionDescription(data.sdp)); }
    if(data.type==='candidate') { try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){} }
}
function endCall(silent) {
    if(!silent && callTarget) send({action:'call_end', to: callTarget});
    if(pc) { pc.close(); pc = null; } if(localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
    callTarget = null; document.getElementById('incomingScreen').style.display = 'none';
}

function doLogin() { var u = document.getElementById('au').value.trim(); var p = document.getElementById('ap').value; if(!u || !p) return; cu = u; saveAccount(u, p); connect(); }
function regNext(step) {
    if(step===1) {
        regData.name = document.getElementById('regName').value.trim();
        regData.phone = document.getElementById('regPhone').value.trim();
        regData.email = document.getElementById('regEmail').value.trim();
        if(!regData.name || !regData.phone) return alert("Заполните поля");
        document.getElementById('regStep1').style.display='none'; document.getElementById('regStep2').style.display='block';
    } else if(step===2) {
        regData.pass = document.getElementById('regPass').value;
        if(!regData.pass) return alert("Введите пароль");
        document.getElementById('regStep2').style.display='none'; document.getElementById('regStep3').style.display='block';
        startAgeVerification();
    }
}
async function startAgeVerification() {
    document.getElementById('ageVerifyStatus').innerText = "Загрузка моделей...";
    await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights/');
    await faceapi.nets.faceLandmark68Net.loadFromUri('https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights/');
    await faceapi.nets.ageGenderNet.loadFromUri('https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights/');
    try { var s = await navigator.mediaDevices.getUserMedia({video:true}); document.getElementById('ageVerifyVideo').srcObject = s; } catch(e) { return alert("Нет камеры"); }
    var buffer = [];
    var loop = setInterval(async () => {
        var det = await faceapi.detectSingleFace(document.getElementById('ageVerifyVideo')).withFaceLandmarks().withAgeAndGender();
        if(det) {
            buffer.push(det.age); if(buffer.length > 20) buffer.shift();
            document.getElementById('ageVerifyStatus').innerText = "Возраст: ~" + Math.round(buffer.reduce((a,b)=>a+b,0)/buffer.length) + " лет";
            if(buffer.length >= 20) {
                clearInterval(loop); s.getTracks().forEach(t=>t.stop());
                send({action:'register', username: regData.name, password: regData.pass, phone: regData.phone, email: regData.email});
            }
        }
    }, 400);
}
