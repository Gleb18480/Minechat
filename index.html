<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minechat (Russia)</title>
    <style>
        :root { --bg: #0e1621; --panel: #17212b; --text: #ffffff; --accent: #2481cc; --badge: #4fae4e; }
        body.light-theme { --bg: #f4f4f5; --panel: #ffffff; --text: #000000; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        html, body { background: var(--bg); color: var(--text); height: 100%; overflow: hidden; }

        #app { height: 100vh; display: flex; flex-direction: column; }

        /* Экран авторизации */
        #auth { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-box { width: 100%; max-width: 400px; text-align: center; }
        .inp { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 8px; border: none; background: var(--panel); color: var(--text); outline: none; }
        .btn { width: 100%; padding: 14px; margin-top: 8px; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; background: var(--accent); }
        
        /* Главный экран */
        #main { display: none; flex-direction: column; height: 100%; }
        .hdr { padding: 12px 14px; background: var(--panel); font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        #content-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }

        /* Сообщения */
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; background: var(--panel); word-wrap: break-word; position: relative; }
        .msg.my { align-self: flex-end; background: var(--accent); }
        .msg .verified-badge { color: var(--badge); font-size: 14px; margin-left: 5px; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; }

        /* Поле ввода */
        .input-area { padding: 10px; background: var(--panel); display: flex; gap: 8px; align-items: center; }
        .input-area input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: var(--bg); color: var(--text); outline: none; }
        .attach-btn { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; padding: 0 5px; }
        .send-btn { background: var(--accent); border: none; color: white; padding: 10px 15px; border-radius: 20px; cursor: pointer; }

        /* Меню вложений */
        .menu { position: absolute; bottom: 70px; left: 10px; background: var(--panel); padding: 10px; border-radius: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .menu-item { padding: 10px 15px; cursor: pointer; border-radius: 8px; background: var(--bg); text-align: center; }

        /* Нижняя панель с фишками */
        .bottom-bar { padding: 10px; background: var(--panel); display: flex; gap: 10px; border-top: 1px solid #2b394a; }
        .bottom-bar button { flex: 1; padding: 10px; border: none; border-radius: 8px; background: var(--accent); color: white; font-weight: bold; cursor: pointer; }
        .bottom-bar button.secondary { background: #3a4a5a; }
    </style>
</head>
<body>

<div id="app">
    <!-- Авторизация -->
    <div id="auth">
        <div class="auth-box">
            <h2>Вход в Minechat</h2>
            <p id="auth-status" style="margin: 15px 0; color: #ff5555; font-size: 14px;"></p>
            <input type="text" id="username" class="inp" placeholder="Твой никнейм">
            <input type="password" id="password" class="inp" placeholder="Пароль (по умолчанию 123)">
            <button class="btn" onclick="loginOrRegister()">Войти / Зарегистрироваться</button>
        </div>
    </div>

    <!-- Чат -->
    <div id="main">
        <div class="hdr">
            <span>Minechat: Main Channel</span>
            <span id="user-display"></span>
        </div>
        <div id="content-area"></div>
        <div class="input-area">
            <button class="attach-btn" onclick="showAttachMenu()">📎</button>
            <input type="text" id="messageInput" placeholder="Сообщение..." onkeypress="handleEnter(event)">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
        <!-- Новые функции -->
        <div class="bottom-bar">
            <button onclick="createChannel()">Создать канал</button>
            <button class="secondary" onclick="requestVerify()">Запросить галочку</button>
        </div>
    </div>
</div>

<script>
    // --- WebSocket Инициализация (Нативная, под FastAPI) ---
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
    let currentUser = "";
    let myPassword = "";
    let isVerified = false;

    ws.onopen = () => {
        console.log("Подключено к серверу");
    };

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleServerMessage(data);
    };

    ws.onclose = () => {
        console.log("Отключено от сервера");
        document.getElementById('auth-status').innerText = "Соединение потеряно. Обновите страницу.";
    };

    // --- Обработка ответов от сервера ---
    function handleServerMessage(data) {
        const a = data.action;

        if (a === 'register_ok') {
            document.getElementById('auth-status').innerText = "Успешная регистрация! Входим...";
            // Сразу логинимся после регистрации
            ws.send(JSON.stringify({ action: 'login', username: currentUser, password: myPassword }));
        } 
        else if (a === 'register_fail') {
            document.getElementById('auth-status').innerText = "Ошибка: " + data.reason;
        }
        else if (a === 'login_ok') {
            // Успешный вход
            currentUser = data.username;
            isVerified = data.verified_users.includes(currentUser);
            
            document.getElementById('auth').style.display = 'none';
            document.getElementById('main').style.display = 'flex';
            document.getElementById('user-display').innerText = currentUser + (isVerified ? ' ✔️' : '');
            
            // Очищаем чат перед загрузкой истории (если сервер ее прислал)
            document.getElementById('content-area').innerHTML = '';
            if(data.messages && data.messages.length > 0) {
                data.messages.forEach(m => addMessageToChat(m.from, m.text, m.from === currentUser, data.verified_users.includes(m.from), m.type === 'image'));
            }
        }
        else if (a === 'login_fail') {
            document.getElementById('auth-status').innerText = "Ошибка: " + data.reason;
        }
        else if (a === 'new_message') {
            // Пришло новое сообщение
            const msg = data.msg;
            const senderIsVerified = false; // В идеале сервер должен присылать инфу о верификации отправителя, но пока опустим
            addMessageToChat(msg.from, msg.text, msg.from === currentUser, senderIsVerified, msg.type === 'image');
        }
        else if (a === 'channel_created') {
            alert(`Канал "${data.chat.name}" успешно создан!`);
            // В реальном приложении тут нужно добавить канал в список чатов на экране
        }
        else if (a === 'verify_request_sent') {
            alert(data.message);
        }
        else if (a === 'new_verify_request') {
            // Это видит только создатель
            alert(`🔔 Запрос на галочку от: ${data.from}`);
        }
        else if (a === 'error') {
            alert("Ошибка сервера: " + data.message);
        }
    }

    // --- Авторизация ---
    function loginOrRegister() {
        currentUser = document.getElementById('username').value.trim();
        myPassword = document.getElementById('password').value.trim() || '123';
        
        if(!currentUser) return alert('Введите ник!');
        document.getElementById('auth-status').innerText = "Подключение...";

        // Пытаемся зарегистрироваться (если ник занят, сервер выдаст ошибку)
        // Если ник занят, мы потом попробуем войти (для простоты)
        ws.send(JSON.stringify({ action: 'register', username: currentUser, password: myPassword }));
    }

    // --- Чат ---
    function handleEnter(e) {
        if(e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if(!text || ws.readyState !== WebSocket.OPEN) return;

        // Отправляем сообщение в main_channel
        ws.send(JSON.stringify({ 
            action: 'message', 
            chat_id: 'main_channel', 
            type: 'text', 
            text: text 
        }));
        input.value = '';
    }

    function addMessageToChat(user, content, isMe, verified = false, isImage = false) {
        const area = document.getElementById('content-area');
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'my' : ''}`;
        
        const badge = verified ? '<span class="verified-badge">✔️</span>' : '';
        
        if (isImage) {
            div.innerHTML = `<b>${user}${badge}:</b><br><img src="${content}" alt="Фото">`;
        } else {
            div.innerHTML = `<b>${user}${badge}:</b><br>${content}`;
        }
        
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }

    // --- Меню вложений ---
    function showAttachMenu() {
        if(document.querySelector('.menu')) document.querySelector('.menu').remove();
        let m = document.createElement('div');
        m.className = 'menu';
        m.innerHTML = `
            <div class="menu-item" onclick="openCamera()">📷 Камера</div>
            <div class="menu-item" onclick="openGallery()">🖼 Галерея</div>
        `;
        document.body.appendChild(m);
        setTimeout(() => {
            document.addEventListener('click', function closeMenu(e) {
                if (!m.contains(e.target) && !e.target.classList.contains('attach-btn')) {
                    m.remove();
                    document.removeEventListener('click', closeMenu);
                }
            });
        }, 100);
    }

    function openCamera() {
        let inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.capture = 'environment';
        inp.onchange = () => { if(inp.files[0]) sendPhoto(inp.files[0]); };
        inp.click();
    }

    function openGallery() {
        let inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.onchange = () => { if(inp.files[0]) sendPhoto(inp.files[0]); };
        inp.click();
    }

    // --- Загрузка фото через ImgBB ---
    function sendPhoto(file) {
        if (!file) return;
        if (file.size > 10 * 1024 * 1024) return alert('Файл слишком большой (макс. 10 МБ)');

        // ⚠️ ВСТАВЬ СЮДА СВОЙ НОВЫЙ КЛЮЧ ОТ IMGBB
        var IMGBB_KEY = '4640dc0ba0b1c0142e3907c30ed07897';

        alert('Загрузка фото... Пожалуйста, подождите.');
        var formData = new FormData();
        formData.append('image', file);

        fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                // Отправляем ссылку в WebSocket
                ws.send(JSON.stringify({ 
                    action: 'message', 
                    chat_id: 'main_channel', 
                    type: 'image', 
                    text: data.data.url 
                }));
            } else {
                alert('Ошибка ImgBB: ' + (data.error?.message || 'Неизвестная ошибка'));
            }
        })
        .catch(err => {
            console.error(err);
            alert('Ошибка сети при загрузке фото на ImgBB');
        });
    }

    // --- Каналы и Верификация ---
    function createChannel() {
        const name = prompt('Введите название нового канала:');
        if (name) {
            ws.send(JSON.stringify({ action: 'create_channel', name: name }));
        }
    }

    function requestVerify() {
        if (!currentUser) return alert('Сначала войдите в аккаунт.');
        ws.send(JSON.stringify({ action: 'request_verify' }));
    }
</script>
</body>
</html>
