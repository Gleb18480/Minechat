name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies & CocoaPods
      run: |
        npm install
        sudo gem install cocoapods

    - name: Setup Web Directory (Required by Capacitor)
      run: |
        mkdir -p www
        touch www/index.html

    - name: Setup Capacitor iOS
      run: |
        npx cap add ios
        npx cap sync ios

    - name: Inject Permissions (Info.plist)
      run: |
        cp Info.plist ios/App/App/Info.plist

    # ЭТОТ ШАГ ПОКАЖЕТ НАМ ВСЕ СХЕМЫ И WORKSPACE-ФАЙЛЫ
    - name: List Xcode Schemes and Workspaces
      run: |
        cd ios/App
        xcodebuild -list -workspace App.xcworkspace || xcodebuild -list -project App.xcodeproj

    # СБОРКА БЕЗ ПОДПИСИ
    - name: Build iOS Archive (Unsigned)
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath $PWD/build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Zip Archive
      run: |
        cd ios/App/build
        zip -r Minechat-iOS.zip App.xcarchive

    - name: Upload iOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minechat-iOS-Unsigned
        path: ios/App/build/Minechat-iOS.zip