name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies & CocoaPods
      run: |
        npm install
        sudo gem install cocoapods

    - name: Setup Web Directory (Required by Capacitor)
      run: |
        mkdir -p www
        touch www/index.html

    - name: Setup Capacitor iOS
      run: |
        npx cap add ios
        npx cap sync ios

    - name: Inject Permissions (Info.plist)
      run: |
        cp Info.plist ios/App/App/Info.plist

    # ВЫВОДИМ ВСЕ СХЕМЫ В ОТДЕЛЬНЫЙ ФАЙЛ И ЗАГРУЖАЕМ ЕГО
    - name: List Xcode Schemes and Workspaces (Upload to Artifact)
      run: |
        cd ios/App
        echo "=== Available Workspaces ===" > xcode_info.txt
        ls -la *.xcworkspace 2>/dev/null >> xcode_info.txt || echo "No workspace found" >> xcode_info.txt
        echo "=== Available Projects ===" >> xcode_info.txt
        ls -la *.xcodeproj 2>/dev/null >> xcode_info.txt || echo "No project found" >> xcode_info.txt
        echo "=== Schemes from Workspace ===" >> xcode_info.txt
        xcodebuild -list -workspace App.xcworkspace 2>&1 >> xcode_info.txt || echo "Workspace list failed" >> xcode_info.txt
        echo "=== Schemes from Project ===" >> xcode_info.txt
        xcodebuild -list -project App.xcodeproj 2>&1 >> xcode_info.txt || echo "Project list failed" >> xcode_info.txt

    - name: Upload Xcode Info
      uses: actions/upload-artifact@v4
      with:
        name: Xcode-Info
        path: ios/App/xcode_info.txt

    # ОЧИСТКА ПЕРЕД СБОРКОЙ
    - name: Clean Project
      run: |
        cd ios/App
        xcodebuild clean -workspace App.xcworkspace -scheme App || true
        xcodebuild clean -project App.xcodeproj -scheme App || true

    # СБОРКА С ЯВНЫМ УКАЗАНИЕМ ПЛАТФОРМЫ
    - name: Build iOS Archive (Unsigned)
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath $PWD/build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 || \
        xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath $PWD/build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1

    - name: Zip Archive
      run: |
        cd ios/App/build
        zip -r Minechat-iOS.zip App.xcarchive 2>/dev/null || echo "No archive to zip"

    - name: Upload iOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minechat-iOS-Unsigned
        path: ios/App/build/Minechat-iOS.zip