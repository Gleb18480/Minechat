name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies & CocoaPods
      run: |
        npm install
        sudo gem install cocoapods
        cd ios/App && pod install || echo "Pod install skipped/failed, continuing..." && cd ..

    - name: Setup Web Directory (Required by Capacitor)
      run: |
        mkdir -p www
        touch www/index.html

    - name: Setup Capacitor iOS
      run: |
        npx cap add ios
        npx cap sync ios

    - name: Inject Permissions (Info.plist)
      run: |
        cp Info.plist ios/App/App/Info.plist

    # ДЕЛАЕМ СХЕМУ "ОБЩЕЙ" (SHARED) ДЛЯ CI
    - name: Make Scheme Shared
      run: |
        cd ios/App
        SCHEME_FILE=$(find . -name "App.xcscheme" | head -n 1)
        if [ -n "$SCHEME_FILE" ]; then
          echo "Found scheme file: $SCHEME_FILE"
          sed -i '' 's/<Scheme/<Scheme shared="YES"/' "$SCHEME_FILE"
          echo "Scheme has been made shared."
        else
          echo "Warning: App.xcscheme not found. Build might fail."
        fi

    # ВЫВОДИМ ИНФОРМАЦИЮ О ПРОЕКТЕ ДЛЯ ОТЛАДКИ
    - name: List Xcode Schemes and Workspaces
      run: |
        cd ios/App
        echo "=== Available Workspaces ==="
        ls -la *.xcworkspace 2>/dev/null || echo "No workspace found"
        echo "=== Available Projects ==="
        ls -la *.xcodeproj 2>/dev/null || echo "No project found"
        echo "=== Schemes from Workspace ==="
        xcodebuild -list -workspace App.xcworkspace 2>&1 || true
        echo "=== Schemes from Project ==="
        xcodebuild -list -project App.xcodeproj 2>&1 || true

    # СБОРКА С АВТООПРЕДЕЛЕНИЕМ ФАЙЛА (WORKSPACE ИЛИ PROJECT)
    - name: Build iOS Archive (Unsigned)
      run: |
        cd ios/App
        if [ -d "App.xcworkspace" ]; then
          echo "Building using App.xcworkspace..."
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath $PWD/build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        else
          echo "No .xcworkspace found, building using App.xcodeproj..."
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath $PWD/build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        fi

    - name: Zip Archive
      run: |
        cd ios/App/build
        zip -r Minechat-iOS.zip App.xcarchive 2>/dev/null || echo "No archive to zip"

    - name: Upload iOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minechat-iOS-Unsigned
        path: ios/App/build/Minechat-iOS.zip