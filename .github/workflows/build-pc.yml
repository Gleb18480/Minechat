name: Build PC App (Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-pc.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --add-data "index.html;." --name "Minechat" app.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minechat-Windows
        path: dist/Minechat/